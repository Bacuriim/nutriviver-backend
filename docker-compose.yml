# Ambiente local: Postgres + Elasticsearch + backend nativo.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nutriviver
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]

  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/nutriviver
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports: ["8080:8080"]
    depends_on: [postgres, elasticsearch]
    restart: on-failure

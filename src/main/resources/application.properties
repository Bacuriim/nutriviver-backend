spring.application.name=nutriviver-backend
server.port=${PORT:8080}

# Em produção (Neon): DATABASE_URL=jdbc:postgresql://<host>/<db>?sslmode=require, DATABASE_USER, DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nutriviver}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
# Neon pausa o compute ocioso; conexões velhas do pool caem e são refeitas.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST

elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
